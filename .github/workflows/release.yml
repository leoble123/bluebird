# Builds Bluebird on GitHub's computers whenever new code is pushed, runs the tests, and publishes the optimized
# preview APK as a GitHub release. Phones pick it up from the Releases page (or automatically with Obtainium).
name: Build and publish

on:
  push:
    branches: [main, prompt-2-design-system]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key as the one already on the phone, or Android refuses to update
      # it. The key is this project's local debug key, stored as the SIGNING_KEY_BASE64 repository secret.
      - name: Install the signing key
        env:
          KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The SIGNING_KEY_BASE64 secret is missing. See 'Updates over the air' in the README."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEY" | base64 -d > ~/.android/debug.keystore

      - name: Test and build
        run: ./gradlew testDebugUnitTest assemblePreview --console=plain

      - name: Name the APK
        run: cp app/build/outputs/apk/preview/app-preview.apk "Bluebird-build-${{ github.run_number }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bluebird build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Bluebird-build-${{ github.run_number }}.apk
